plugins { id 'fabric-loom' version '1.10.5' }
group = 'ru.sotocoming'
version = '1.0.0'
base { archivesName = 'sefi-skins' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
loom { mixin { defaultRefmapName = 'sefi-skins.refmap.json' } }

tasks.register('testSkinIdentity', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.sotocoming.sefiskins.SkinIdentityCheck'
}
check.dependsOn testSkinIdentity
