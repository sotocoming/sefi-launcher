appId: com.sefi.launcher
productName: SEFI Launcher
artifactName: SEFI-Launcher-Setup.${ext}
beforePack: scripts/installer-privacy.cjs
afterPack: scripts/windows-resources.cjs
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
  - from: build/icon.ico
    to: brand/icon.ico
  - from: PRIVACY.md
    to: docs/PRIVACY.md
  - from: PRIVACY.ru.md
    to: docs/PRIVACY.ru.md
  - from: LICENSE
    to: docs/LICENSE
  - from: CODE_SIGNING.md
    to: docs/CODE_SIGNING.md
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Resource editing is performed by afterPack; signing requires publisher credentials.
  signAndEditExecutable: false
nsis:
  oneClick: true
  # English fallback; Russian Windows selects the Russian UI and privacy notice.
  installerLanguages:
    - en_US
    - ru_RU
  include: build/installer.nsh
  perMachine: false
  allowElevation: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: sotocoming
  repo: sefi-launcher
