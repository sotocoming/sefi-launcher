name: Build SEFI Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sefi-launcher-windows
          path: |
            release/SEFI-Launcher-Setup-*.exe
            release/SEFI-Launcher-Setup-*.exe.blockmap
            release/latest.yml
